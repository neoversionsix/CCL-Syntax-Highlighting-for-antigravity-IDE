name: Publish Extension to Open VSX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate JSON files
        run: |
          node -e 'for (const p of ["package.json", "language-configuration.json", "syntaxes/ccl.tmLanguage.json", "snippets/ccl.code-snippets"]) JSON.parse(require("fs").readFileSync(p, "utf8"));'

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$PKG_VERSION" >&2
            exit 1
          fi

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "Missing OVSX_PAT repository secret" >&2
            exit 1
          fi
          npx --yes ovsx publish *.vsix -p "$OVSX_PAT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" *.vsix --generate-notes
